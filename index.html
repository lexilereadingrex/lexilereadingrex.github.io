<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>藍思閱讀單字王</title>
<meta name="description" content="藍思（Lexile）閱讀單字守城遊戲：答對單字，弓箭手就會擊退來襲的怪物。手機、平板、電腦都能玩，不用登入。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="藍思閱讀單字王">
<meta property="og:title" content="藍思閱讀單字王">
<meta property="og:description" content="藍思（Lexile）閱讀單字守城遊戲：答對單字守住城堡，成為單字王。手機、平板、電腦都能玩。">
<meta property="og:url" content="https://lexilereadingrex.github.io/">
<meta property="og:image" content="https://lexilereadingrex.github.io/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單欄。上方是戰場畫布（城堡在左，敵人沿小路從右邊走來），下方是題目板。
   畫風：繪本式平塗＋墨線，冷調石牆與暮色天空，赭黃旗幟點綴。整頁固定深色石板底。 */
:root{
  --page:#1f2a30; --page2:#283740; --panel:#eef0ea; --panel2:#e0e5dd; --ink:#1c2428; --muted:#5d686b; --line:#c3cbc2;
  --ochre:#c9932e; --ochreD:#9c6f1c; --moss:#4f7a4a; --brick:#a8463a; --steel:#2f4a5e; --steelD:#1d3240;
  --onDark:#e9ece4; --onDarkMuted:#a3b0ae;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --latin:"Alegreya",Georgia,"Times New Roman",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--page);color:var(--onDark);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.latin{font-family:var(--latin)}
.ipa{font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Arial Unicode MS",sans-serif;font-size:.85em;color:var(--muted);font-weight:400}

/* 標題 */
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 18px;border-bottom:1px solid #ffffff1f;padding-bottom:14px}
.brand h1{font-family:var(--display);font-weight:900;font-size:36px;letter-spacing:.12em;margin:0;line-height:1.1}
.brand .en{font-family:var(--latin);font-weight:700;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--ochre);display:block;margin-bottom:4px}
.brand p{margin:0;color:var(--onDarkMuted);font-size:14px}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;font-weight:700;background:var(--steel);color:var(--onDark);box-shadow:inset 0 -3px 0 var(--steelD);min-height:46px}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 var(--steelD)}
.btn.gold{background:var(--ochre);color:#1c1608;box-shadow:inset 0 -3px 0 var(--ochreD)}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--line)}
.btn.quiet{background:transparent;color:var(--onDark);box-shadow:inset 0 0 0 1.5px #ffffff33}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 150px}
.full{width:100%}

/* 地圖：關卡卡片 */
.stages{display:grid;gap:16px}
.stage{background:var(--panel);color:var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 1px 0 #ffffff14,0 10px 24px #0000004d}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:var(--ar,720/300)}
.stage .body{padding:14px 16px 16px;display:grid;gap:10px}
.stage .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage h2{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.06em;margin:0}
.stage .no{font-family:var(--latin);font-weight:700;color:var(--muted);font-size:14px;letter-spacing:.1em}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px;background:var(--page2);padding:6px;border-radius:12px}
.sec{display:grid;gap:0;padding:10px 8px;border-radius:8px;text-align:center;color:var(--onDarkMuted)}
.sec b{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.08em;color:var(--onDark)}
.sec span{font-size:13px}
.sec.on{background:var(--panel);color:var(--muted)}
.sec.on b{color:var(--ink)}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.ucard{background:var(--panel);color:var(--ink);border-radius:10px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.uhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--muted);font-size:14px}
.uhead h3{margin:0;font-size:24px;font-weight:800;color:var(--ink)}
.peek{margin:0;color:var(--muted);font-size:16px;line-height:1.4}
.weeks{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.wk{padding:8px 16px;border-radius:999px;font-weight:700;box-shadow:inset 0 0 0 1.5px #ffffff33;color:var(--onDark)}
.wk.on{background:var(--ochre);color:#1c1608;box-shadow:none}
.parts{display:grid}
.part{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.part:last-child{border-bottom:1px solid var(--line)}
.part .stars svg{width:16px;height:16px;vertical-align:-2px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px;line-height:1.6}
.t0{background:#dbe6d7;color:#3e6a3a}.t1{background:#ebe2c8;color:#7a5a12}.t2{background:#efd9d5;color:#8a3a2f}.t3{background:#e2d6e4;color:#5a3360}
.bestiary{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px;margin:0 0 14px}
.beast{background:var(--panel);color:var(--ink);border-radius:10px;display:flex;gap:12px;align-items:center;padding:10px}
.beast canvas{width:96px;height:auto;aspect-ratio:150/116;border-radius:6px;flex:none}
.beast b{font-family:var(--display);font-size:17px;letter-spacing:.06em}
.beast p{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.5}
.btn.sm{min-height:40px;padding:6px 14px;font-size:15px}
.pill{font-family:var(--latin);font-weight:700;font-size:14px;border:1.5px solid var(--line);border-radius:4px;padding:0 8px;color:var(--steel)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.stage.locked canvas{filter:grayscale(1) brightness(.6)}
.stage.locked .body{color:var(--muted)}
.lockline{display:flex;align-items:center;gap:8px;font-size:14px}
.lockline svg{width:16px;height:16px}
.foot{margin-top:18px;font-size:13px;color:var(--onDarkMuted);text-align:center}

/* 戰場 */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.topbar b{font-family:var(--display);font-weight:900;letter-spacing:.04em;font-size:clamp(14px,4vw,18px);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){ .tbtn{padding:8px 9px} .topbar{gap:6px} }
.tgrp{display:flex;gap:6px;flex:none}
#mute{padding:8px 10px}
#mute svg{width:18px;height:18px}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;box-shadow:inset 0 0 0 1.5px #ffffff2e;font-weight:700;font-size:14px;min-height:40px}
.tbtn svg{width:16px;height:16px}
.field{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 10px 24px #0000004d}
#cv{display:block;width:100%;height:auto;aspect-ratio:var(--ar,720/300);touch-action:manipulation}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 2px 12px;font-size:14px;color:var(--onDarkMuted);flex-wrap:wrap}
.hud .grp{display:flex;align-items:center;gap:8px}
.pips{display:inline-flex;gap:3px}
.pips svg{width:17px;height:17px}
.num{font-variant-numeric:lining-nums tabular-nums;color:var(--onDark);font-weight:700}

/* 題目板 */
.qp{background:var(--panel);color:var(--ink);border-radius:10px;padding:14px 16px 16px;min-height:236px}
.qlabel{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.12em}
.prompt{margin:4px 0 2px;word-break:break-word}
.prompt.w{font-family:var(--latin);font-weight:800;font-size:38px;line-height:1.15}
.prompt.zh{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.04em}
.prompt.sent{font-family:var(--latin);font-weight:700;font-size:23px;line-height:1.45}
.pos{font-family:var(--latin);font-size:16px;color:var(--muted);font-weight:500;margin-left:8px;letter-spacing:0}
.blank{display:inline-block;min-width:88px;border-bottom:2.5px solid var(--ochre);margin:0 4px;transform:translateY(-4px)}
.trans{color:var(--muted);font-size:15px}
.say{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--steel);padding:6px 10px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--line)}
.say svg{width:16px;height:16px}
.bigsay{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px auto 2px;padding:14px 22px;border-radius:10px;background:var(--panel2);color:var(--steel);font-weight:700;box-shadow:inset 0 -3px 0 var(--line)}
.bigsay svg{width:28px;height:28px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{background:var(--panel2);border:1.5px solid var(--line);border-radius:8px;padding:10px;font-size:19px;font-weight:700;min-height:56px;color:var(--ink);word-break:break-word;position:relative}
.opt.latin{font-size:22px;font-weight:700}
.opt .k{position:absolute;left:8px;top:4px;font-family:var(--latin);font-size:12px;color:var(--muted);font-weight:700}
.opt:hover:not(:disabled){border-color:var(--steel)}
.opt.ok{background:var(--moss);border-color:var(--moss);color:#fff}
.opt.no{background:var(--brick);border-color:var(--brick);color:#fff}
.opt.ok .k,.opt.no .k{color:#ffffffaa}
.opt:disabled{cursor:default}
.fb{margin-top:10px;font-size:15px;min-height:1.6em}
.fb b{font-family:var(--latin);font-size:19px}
.fb .good{color:var(--moss);font-weight:700}
.fb .bad{color:var(--brick);font-weight:700}
.wait{display:grid;place-items:center;min-height:200px;text-align:center;color:var(--muted)}
.wait b{font-family:var(--display);font-size:20px;color:var(--ink);letter-spacing:.08em}

/* 清單、結果 */
.sheet{background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 16px;margin-bottom:14px}
.sheet h3{font-family:var(--display);font-weight:900;letter-spacing:.06em;font-size:17px;margin:10px 0 2px}
.word{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:0}
.word .en{font-family:var(--latin);font-weight:800;font-size:23px}
.word .zh{font-weight:700}
.word .ex{font-family:var(--latin);font-size:16px;color:#3c474b}
.word .exz{font-size:14px;color:var(--muted)}
.word .cnt{font-size:13px;color:var(--brick);font-weight:700;margin-left:6px}
.result{background:var(--panel);color:var(--ink);border-radius:10px;overflow:hidden;margin-bottom:14px}
.result canvas{display:block;width:100%;height:auto;aspect-ratio:var(--ar,720/300)}
.result .body{padding:16px;text-align:center}
.result h2{font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:.12em;margin:0}
.result .stars svg{width:30px;height:30px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--panel2);border-radius:8px;padding:8px 4px}
.stats .n{font-family:var(--latin);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}
.stats .l{font-size:13px;color:var(--muted)}
.lead{color:var(--onDarkMuted);font-size:15px;margin:0 0 12px}
.help p{margin:12px 0}
.links{display:grid;gap:12px}
.lk{display:flex;align-items:center;gap:14px;background:var(--panel);color:var(--ink);border-radius:10px;padding:16px;text-decoration:none;box-shadow:inset 0 -3px 0 var(--line)}
.lk:hover{box-shadow:inset 0 -3px 0 var(--ochre)}
.lk:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.lk .ico{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff}
.lk .ico svg{width:24px;height:24px}
.lk .t{font-weight:700;font-size:17px;line-height:1.35}
.lk .d{font-size:13px;color:var(--muted);word-break:break-all}
.lk .go{margin-left:auto;flex:none;color:var(--muted)}
.lk .go svg{width:18px;height:18px}
.help b{font-family:var(--display)}
.modal{position:fixed;inset:0;background:#0b1013b3;display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{background:var(--panel);color:var(--ink);border-radius:10px;padding:18px;max-width:360px;width:100%}
.modal p{margin:0 0 14px;font-weight:700}
@media (max-width:420px){ .prompt.w{font-size:32px} .opt.latin{font-size:20px} .brand h1{font-size:30px} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal" hidden><div class="box"><p id="modalMsg"></p><div class="row"><button class="btn alt" id="modalNo">取消</button><button class="btn" id="modalYes">確定</button></div></div></div>

<script>
/* =========================================================
   給老師／維護者：題庫在這裡。每一週是 WEEKS 裡的一筆，
   每週有幾個主題（units），每個主題的單字照講義順序排。
   每個字：w 英文、ipa 音標、pos 詞性、zh 中文、ex 例句、exZh 例句中譯。
   例句裡有「原封不動」出現 w 的字才會出例句填空題（例如 laid 不會出 lay 的填空）。
   加新的一週：複製第 1 週那一段，改 id（w2、w3…）、name 和單字即可。
   ========================================================= */
const WEEKS = [
  { id:'w1', name:'第 1 週', units:[
    { id:"animals", en:"Animals & Pets", zh:"動物與寵物", theme:"forest", words:[
      {w:"adapt", ipa:"əˈdæpt", pos:"v.", zh:"適應", ex:"Animals must adapt to their surroundings when food and water become difficult to find.", exZh:"當食物與水變得難以取得時，動物必須適應周遭的環境。"},
      {w:"cave", ipa:"kev", pos:"n.", zh:"洞穴", ex:"The explorers entered a dark cave and discovered strange marks on the walls.", exZh:"探險家進入一座黑暗的洞穴，發現牆壁上有奇怪的痕跡。"},
      {w:"chase", ipa:"tʃes", pos:"v.", zh:"追逐", ex:"The hungry lion began to chase the zebras as they approached the water hole.", exZh:"當斑馬靠近水坑時，飢餓的獅子開始追逐牠們。"},
      {w:"crack", ipa:"kræk", pos:"v./n.", zh:"裂開；裂縫", ex:"The eggshell began to crack, and a tiny bird slowly pushed its head out.", exZh:"蛋殼開始裂開，一隻小鳥慢慢地把頭伸了出來。"},
      {w:"crawl", ipa:"krɔl", pos:"v.", zh:"爬行", ex:"The injured insect struggled to crawl across the ground after the heavy rain.", exZh:"大雨過後，受傷的昆蟲努力爬過地面。"},
      {w:"creature", ipa:"ˈkritʃɚ", pos:"n.", zh:"生物", ex:"The queen had never seen such a beautiful creature with such a long tail.", exZh:"女王從未見過擁有如此長尾巴的美麗生物。"},
      {w:"explore", ipa:"ɪkˈsplor", pos:"v.", zh:"探索", ex:"The young detective decided to explore the abandoned museum in search of clues.", exZh:"年輕的偵探決定探索那座廢棄的博物館，尋找線索。"},
      {w:"feather", ipa:"ˈfɛðɚ", pos:"n.", zh:"羽毛", ex:"The bird spread its colorful feathers to attract a mate during the breeding season.", exZh:"那隻鳥展開鮮豔的羽毛，在繁殖季節吸引配偶。"},
      {w:"female", ipa:"ˈfimel", pos:"adj./n.", zh:"雌性的；雌性動物", ex:"Female giraffe weevils roll leaves into small nests where they can lay their eggs.", exZh:"雌性長頸象鼻蟲將葉子捲成小巢，並在裡面產卵。"},
      {w:"fierce", ipa:"fɪrs", pos:"adj.", zh:"兇猛的", ex:"The fierce animal stood near the water hole, waiting for its next meal.", exZh:"那隻兇猛的動物站在水坑附近，等待下一頓獵物。"},
      {w:"hide", ipa:"haɪd", pos:"v.", zh:"躲藏", ex:"The lions often hide near the water hole and wait for zebras to approach.", exZh:"獅子經常躲在水坑附近，等待斑馬靠近。"},
      {w:"huge", ipa:"hjudʒ", pos:"adj.", zh:"巨大的", ex:"The children were amazed when they spotted a huge elephant near the river.", exZh:"孩子們在河邊發現一頭巨大的大象時，感到非常驚訝。"},
      {w:"insect", ipa:"ˈɪnsɛkt", pos:"n.", zh:"昆蟲", ex:"Dr. Tallow explained that certain insects build cocoons to protect themselves while growing.", exZh:"塔洛博士解釋，某些昆蟲會結繭，在成長過程中保護自己。"},
      {w:"lay", ipa:"le", pos:"v.", zh:"下蛋", ex:"The mother bird laid several eggs in her nest and kept them warm until they hatched.", exZh:"母鳥在巢裡產下幾顆蛋，並持續為牠們保溫，直到小鳥孵化。"},
      {w:"nest", ipa:"nɛst", pos:"n.", zh:"巢穴", ex:"Each night, the chimp climbs a tree and builds a new nest from branches.", exZh:"黑猩猩每晚都會爬上樹，用樹枝搭建新的巢穴。"},
      {w:"wild", ipa:"waɪld", pos:"adj.", zh:"野生的", ex:"Helen behaved so wildly at dinner that her parents could not control her.", exZh:"海倫在晚餐時表現得非常失控，連父母都無法管教她。"},
      {w:"poisonous", ipa:"ˈpɔɪzənəs", pos:"adj.", zh:"有毒的", ex:"The children were warned not to touch the poisonous mushrooms growing near the trees.", exZh:"孩子們被警告不要碰觸樹木附近生長的有毒蘑菇。"},
      {w:"predator", ipa:"ˈprɛdətɚ", pos:"n.", zh:"掠食者", ex:"The mother bird pretended to be injured to lead the predator away from her nest.", exZh:"母鳥假裝受傷，將掠食者引離自己的鳥巢。"},
      {w:"protect", ipa:"prəˈtɛkt", pos:"v.", zh:"保護", ex:"The killdeer pretended to have a broken wing to protect its eggs from danger.", exZh:"那隻雙領鴴假裝翅膀受傷，以保護自己的蛋免受危險。"},
      {w:"spot", ipa:"spɑt", pos:"v.", zh:"看見", ex:"The hikers spotted a large snake moving slowly through the branches above them.", exZh:"健行者發現一條大蛇正緩慢地穿過他們頭上的樹枝。"},

const MUST = [ {}, {runner:2}, {runner:1, shield:2}, {runner:2, shield:2} ];
function planKinds(n, tier, boss){
  const roll = () => { let r = Math.random(), acc = 0; for(const [k,p] of Object.entries(MIX[tier])){ acc += p; if(r < acc) return k; } return 'grunt'; };
  const ks = Array.from({length:n}, roll);
  ks[0] = 'grunt';                                   // 第一隻一定是一般敵人，讓學生先暖身
  const last = boss ? n-1 : n;
  for(const [k,need] of Object.entries(MUST[tier])){
    let have = ks.filter(x => x === k).length;
    const free = shuffle(ks.map((x,i) => i).filter(i => i > 0 && i < last && ks[i] === 'grunt'));
    while(have < need && free.length){ ks[free.pop()] = k; have++; }
  }
  if(boss && n > 1) ks[n-1] = 'boss';
  return ks;
}

const canSpeak = 'speechSynthesis' in window;
/* 發音：只挑自然的人聲。蘋果裝置內建很多特效聲音（Bad News、Superstar、Zarvox…），聽起來像吶喊或唱歌，全部排除。 */
const NOVELTY = /albert|bad ?news|bahh|bells|boing|bubbles|cellos|good ?news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|princess|deranged|hysterical|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley|bruce|agnes|vicki|victoria/i;
const PREFERRED = [/samantha/i, /\bava\b/i, /allison/i, /susan/i, /google us english/i, /microsoft (aria|jenny|ana|michelle|guy|christopher|eric).*natural/i,
                   /microsoft (aria|jenny|zira|david|mark)/i, /\balex\b/i, /google uk english female/i, /karen|daniel|moira|tessa|serena/i];
let voice = null;
function englishVoices(){
  if(!canSpeak) return [];
  return speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang) && !NOVELTY.test(v.name));
}
function pickVoice(){
  const vs = englishVoices();
  if(S.voice){ const v = vs.find(x => x.name === S.voice); if(v) return v; }
  for(const re of PREFERRED){ const v = vs.find(x => re.test(x.name) && /en[-_]US/i.test(x.lang)) || vs.find(x => re.test(x.name)); if(v) return v; }
  return vs.find(x => /en[-_]US/i.test(x.lang) && x.localService) || vs.find(x => /en[-_]US/i.test(x.lang)) || vs[0] || null;
}
function speak(text){
  if(!canSpeak) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if(!voice) voice = pickVoice();
    if(voice){ u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
    u.rate = 0.88; u.pitch = 1; u.volume = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 音效：用 Web Audio 即時合成，不用下載音檔 ---------- */
let AC = null, MASTER = null, NOISE = null;
function audio(){
  if(S.mute) return null;
  try{
    if(!AC){
      const C = window.AudioContext || window.webkitAudioContext; if(!C) return null;
      AC = new C(); MASTER = AC.createGain(); MASTER.gain.value = .45; MASTER.connect(AC.destination);
      NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    }
    if(AC.state === 'suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function env(gn, t, vol, dur, attack){
  gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(vol, t + attack);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function tone(freq, dur, o = {}){
  const t = AC.currentTime + (o.delay || 0), osc = AC.createOscillator(), gn = AC.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(freq, t);
  if(o.slide) osc.frequency.linearRampToValueAtTime(Math.max(20, freq + o.slide), t + dur);
  env(gn, t, o.vol || .3, dur, o.attack || .005);
  osc.connect(gn); gn.connect(MASTER); osc.start(t); osc.stop(t + dur + .05);
}
function noise(dur, o = {}){
  const t = AC.currentTime + (o.delay || 0), src = AC.createBufferSource(), f = AC.createBiquadFilter(), gn = AC.createGain();
  src.buffer = NOISE; f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1000, t); f.Q.value = o.q || 1;
  if(o.slide) f.frequency.linearRampToValueAtTime(Math.max(40, (o.freq || 1000) + o.slide), t + dur);
  env(gn, t, o.vol || .3, dur, o.attack || .004);
  src.connect(f); f.connect(gn); gn.connect(MASTER); src.start(t, Math.random()*.5); src.stop(t + dur + .05);
}

function rngFrom(str){
  let h = 2166136261;
  for(const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0) / 4294967296; };
}

function ridge(g,r,base,amp,f,x0=0,x1=W){

}
function pine(g,x,y,h,col,shade){

    g.beginPath(); g.moveTo(x, yy - h*.5); g.lineTo(x+ww, yy); g.lineTo(x-ww, yy); g.closePath(); g.fill();
    if(shade){ g.fillStyle = shade; g.beginPath(); g.moveTo(x, yy - h*.5); g.lineTo(x+ww, yy); g.lineTo(x, yy); g.closePath(); g.fill(); g.fillStyle = col; }
  }
}

function bricks(g,x,y,w,h,r,T){

function drawFlag(g,T,t){

function drawEnemy(g,e,T,target){

  const h = 30*s, w = 13*s;
  const bodyPath = () => { g.beginPath(); g.moveTo(0,-h); g.bezierCurveTo(w*1.25,-h, w*1.3,-3, w*.8,-2); g.quadraticCurveTo(0,1,-w*.8,-2); g.bezierCurveTo(-w*1.3,-3,-w*1.25,-h,0,-h); g.closePath(); };

    g.fillStyle = '#8b959a'; g.beginPath(); g.moveTo(-2,-h*.8-w*.9); g.lineTo(0,-h*.8-w*.9-6); g.lineTo(2,-h*.8-w*.9); g.closePath(); g.fill(); g.stroke();

    if(kind === 'boss'){

    else { g.fillStyle = kind === 'boss' ? '#a8463a' : T.eye; circle(g,cx-1.1*er,ey+.3,1.7*er); g.fill(); }
  });
  g.strokeStyle = T.ink; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(ex-7*er,ey-5.5*er); g.lineTo(ex-1.5*er,ey-3.5*er); g.moveTo(ex+1.5*er,ey-3.5*er); g.lineTo(ex+7.5*er,ey-5.8*er); g.stroke();
  g.lineWidth = 1.3; g.beginPath(); g.moveTo(ex-4*er,-h*.33); g.lineTo(ex-2*er,-h*.37); g.lineTo(ex,-h*.33); g.lineTo(ex+2*er,-h*.37); g.lineTo(ex+4*er,-h*.33); g.stroke();

    g.strokeStyle = '#5d676c'; g.lineWidth = 3; circle(g,sx,sy,sr-1.5); g.stroke();

  g.restore();
  // 還要答對幾次（多血量的敵人頭上顯示）

    g.fillStyle = '#e0aa3e';
    for(let k=0;k<3;k++){ const a = e.t*6 + k*2.1; circle(g, e.x + Math.cos(a)*10*s, GROUND - 32*s - 4 + Math.sin(a)*3, 2); g.fill(); }

/* ---------- 出題 ---------- */
const TYPES = ['en2zh','zh2en','listen','fill'];
const TYPE_LABEL = { en2zh:'看英文，選中文', zh2en:'看中文，選英文', listen:'聽發音，選單字', fill:'例句填空' };
const blankRe = x => new RegExp('\\b' + x.w + '\\b');
const canFill = x => blankRe(x).test(x.ex);
function makeQuestion(x, pool, avoid){
  let types = TYPES.filter(t => t !== avoid && (t !== 'listen' || canSpeak) && (t !== 'fill' || canFill(x)));
  const type = types[Math.floor(Math.random()*types.length)];
  if(pool.length < 4) pool = allWords;
  const seenW = new Set([x.w]), seenZ = new Set([x.zh]), others = [];
  for(const y of shuffle(pool.length >= 4 ? pool : allWords)){
    if(others.length === 3) break;
    if(seenW.has(y.w) || seenZ.has(y.zh)) continue;
    seenW.add(y.w); seenZ.add(y.zh); others.push(y);
  }
  const opts = shuffle([x, ...others]);
  return { word:x, type, opts, answer:x.w, labels: opts.map(o => type === 'en2zh' ? o.zh : o.w) };
}

let G = null;
function stopGame(){ if(G){ G.dead = true; cancelAnimationFrame(G.raf); } }

function startGame(cfg){
  stopGame();
  const T = THEMES[cfg.theme];
  cfg = Object.assign({}, cfg, { speed: cfg.speed * PATH_K });
  G = { cfg, T, bg:makeBg(cfg.theme), pool:cfg.pool, queue:(ws => { const ks = planKinds(ws.length, cfg.tier || 0, cfg.boss); return ws.map((w,i) => ({ w, kind:ks[i] })); })(shuffle(cfg.words)), total:cfg.words.length,
        enemies:[], arrows:[], stuck:[], parts:[], cracks:[], boulder:null, banner:null,
        hp:MAX_HP, right:0, killed:0, breached:0, streak:0, missed:new Set(),
        time:0, spawnT:1.2, slowUntil:0, lock:0, cur:null, panel:'', pull:0, shake:0, paused:false, over:false, dead:false, last:0 };
  $app.innerHTML = `
    <div class="topbar">
      <button class="tbtn" id="back">${IC.back}撤退</button>
      <b>${esc(cfg.title)}</b>
      <span class="tgrp"><button class="tbtn" id="mute" aria-label="音效開關">${S.mute ? IC.soundOff : IC.soundOn}</button><button class="tbtn" id="pause">${IC.pause}暫停</button></span>
    </div>

    <div class="hud">
      <div class="grp">城牆 <span class="pips" id="hpP"></span></div>
      <div class="grp">連擊 <span class="pips" id="cbP"></span></div>
      <div class="grp">剩餘敵人 <span class="num" id="left"></span></div>
    </div>
    <div class="qp" id="qp"></div>`;
  G.cv = document.getElementById('cv'); G.g = G.cv.getContext('2d');
  audio();   // 在按下開始的那一下解鎖音效（手機瀏覽器規定要使用者點擊後才能出聲）
  document.getElementById('mute').onclick = () => {
    S.mute = !S.mute; save();
    const b = document.getElementById('mute'); b.innerHTML = S.mute ? IC.soundOff : IC.soundOn;
    b.setAttribute('aria-pressed', S.mute ? 'true' : 'false');

  };
  document.getElementById('back').onclick = () => { const was = G.paused; G.paused = true; ask('確定要撤退嗎？這一場的進度不會保留。', () => { stopGame(); showMap(); }); document.getElementById('modalNo').onclick = () => { document.getElementById('modal').hidden = true; G.paused = was; syncPause(); }; };
  document.getElementById('pause').onclick = () => { G.paused = !G.paused; syncPause(); };
  hud(); renderWait();
  G.raf = requestAnimationFrame(loop);
  scrollTo(0,0);

function syncPause(){
  const b = document.getElementById('pause'); if(!b) return;
  b.innerHTML = G.paused ? `${IC.play}繼續` : `${IC.pause}暫停`;
}
function hud(){
  if(!G || G.dead) return;
  const left = G.queue.length + G.enemies.filter(e => e.state === 'walk').length;
  document.getElementById('hpP').innerHTML = Array.from({length:MAX_HP}, (_,i) => IC.shield(i < G.hp)).join('');
  document.getElementById('cbP').innerHTML = Array.from({length:COMBO}, (_,i) => IC.gem(i < G.streak % COMBO)).join('');
  document.getElementById('left').textContent = `${left} / ${G.total}`;
}

function spawn(){
  const { w, kind } = G.queue.shift(), K = KINDS[kind];
  const color = kind === 'runner' ? ['#3f7a6a','#4f6f86'][Math.floor(Math.random()*2)] : kind === 'boss' ? '#4a2f45' : G.T.enemy[Math.floor(Math.random()*G.T.enemy.length)];
  G.enemies.push({ w, kind, hp:K.hp, maxHp:K.hp, spd:K.spd, dmg:K.dmg, x:W + (kind === 'boss' ? 44 : 24), state:'walk', t:Math.random()*3, dt:0, stun:0, flash:0, doomed:false, lastType:null,
                   scale:K.scale[0] + Math.random()*(K.scale[1]-K.scale[0]), horn: kind === 'boss' ? 0 : kind === 'runner' ? 1 : Math.floor(Math.random()*3), color });
  if(kind !== 'grunt' && !S.seen[kind]){ S.seen[kind] = true; save(); G.banner = { text:`新敵人：${K.name}　${K.short}`, t:2.8 }; sfx(kind === 'boss' ? 'boss' : 'newEnemy'); }
  else if(kind === 'boss'){ G.banner = { text:`魔王登場　${K.short}`, t:2.4 }; sfx('boss'); }
  hud();
}
function ink(x,y,col,n=14,spd=120){
  for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = spd*(.3+Math.random()*.8);
    G.parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 60, life:.6 + Math.random()*.4, max:1, r:1.5 + Math.random()*3, col }); }
}
function addCrack(){
  const pts = []; let x = 60 + Math.random()*90, y = 140 + Math.random()*80;
  pts.push([x,y]); for(let k=0;k<5;k++){ x += (Math.random()-.5)*16; y += 5 + Math.random()*9; pts.push([x,y]); }
  G.cracks.push(pts);
}

function update(dt){
  G.time += dt;
  const slow = G.time < G.slowUntil ? .35 : 1;
  G.spawnT -= dt;
  const walkers = G.enemies.filter(e => e.state === 'walk');
  if(G.queue.length && walkers.length < 4 && (G.spawnT <= 0 || walkers.length === 0)){ spawn(); G.spawnT = G.cfg.every; }
  for(const e of G.enemies){
    e.t += dt; if(e.flash > 0) e.flash -= dt;
    if(e.state === 'walk'){
      if(e.stun > 0) e.stun -= dt;
      else { e.x -= G.cfg.speed * e.spd * slow * dt; if(e.x <= STOP_X){ e.x = STOP_X; e.state = 'attack'; e.dt = 0; } }
    }else if(e.state === 'attack'){
      e.dt += dt;
      if(e.dt > .45 && !e.hitDone){
        e.hitDone = true; G.hp = Math.max(0, G.hp - e.dmg); G.breached++; G.shake = .4 + .2*(e.dmg-1); for(let c=0;c<e.dmg;c++) addCrack(); sfx('wall');
        G.missed.add(e.w.w); S.wrong[e.w.w] = (S.wrong[e.w.w] || 0) + 1; save();
        ink(STOP_X-6, GROUND-14, '#8a8f8c', 10, 90); hud();
      }
      if(e.dt > .95){ e.state = 'gone'; ink(e.x, GROUND-10, 'rgba(60,60,60,.6)', 8, 60); hud(); }
    }else if(e.state === 'die'){ e.dt += dt; if(e.dt > .55) e.state = 'gone'; }
  }
  for(const a of G.arrows){
    a.t += dt;
    if(a.t >= a.dur && !a.done){
      a.done = true;
      if(a.hit && a.e.state !== 'gone'){
        const e = a.e; e.hp--; e.flash = .15;
        if(e.hp <= 0){ sfx('kill'); e.state = 'die'; e.dt = 0; G.killed++; ink(e.x, GROUND-14*e.scale, e.color, 16 + 10*(e.maxHp-1), 140); ink(e.x, GROUND-14, G.T.ink, 6, 100); }
        else {
          e.doomed = false; e.x = Math.min(W-10, e.x + 18);
          sfx(e.kind === 'shield' && e.hp === 1 ? 'shield' : 'hit');
          if(e.kind === 'shield' && e.hp === 1) ink(e.x - 14*e.scale, GROUND-14*e.scale, '#8a5a34', 18, 150);
          else ink(e.x, GROUND-18*e.scale, e.color, 8, 110);
        }
        hud();
      }
      else if(!a.hit){ sfx('miss'); G.stuck.push({ x:a.x1, y:a.y1, ang:a.endAng, life:3 }); ink(a.x1, a.y1, G.T.pathD, 6, 50); }
    }
  }
  G.arrows = G.arrows.filter(a => !a.done);
  G.stuck.forEach(s => s.life -= dt); G.stuck = G.stuck.filter(s => s.life > 0);
  if(G.boulder){
    const b = G.boulder; b.t += dt;
    if(b.t >= b.dur){
      G.shake = .3; ink(b.x1, GROUND, G.T.pathD, 22, 160);
      G.enemies.filter(e => e.state === 'walk').forEach(e => { const k = e.kind === 'boss' ? .5 : 1; e.x = Math.min(W-10, e.x + 70*k); e.stun = 1.8*k; e.flash = .12; });
      G.boulder = null;
    }
  }
  for(const p of G.parts){ p.life -= dt; p.vy += 320*dt; p.x += p.vx*dt; p.y += p.vy*dt; if(p.y > GROUND+20){ p.y = GROUND+20; p.vy *= -.3; p.vx *= .6; } }
  G.parts = G.parts.filter(p => p.life > 0);
  if(G.shake > 0) G.shake -= dt;
  if(G.pull > 0) G.pull -= dt*3;
  if(G.banner){ G.banner.t -= dt; if(G.banner.t <= 0) G.banner = null; }
  if(!G.over){
    if(G.hp <= 0) finish(false);
    else if(!G.queue.length && G.enemies.every(e => e.state === 'gone') && !G.arrows.length) finish(true);
  }
  if(!G.over) ensureQuestion();
}

function draw(){
  const g = G.g, T = G.T;
  g.setTransform(DPR,0,0,DPR,0,0);
  g.save();
  if(G.shake > 0){ const k = G.shake/.4; g.translate((Math.random()-.5)*7*k, (Math.random()-.5)*4*k); }
  g.drawImage(G.bg,0,0,W,H);
  g.strokeStyle = T.ink; g.lineWidth = 1.6; g.lineJoin = 'round';
  G.cracks.forEach(c => { g.beginPath(); c.forEach(([x,y],i) => i ? g.lineTo(x,y) : g.moveTo(x,y)); g.stroke(); });
  drawFlag(g,T,G.time);
  drawArcher(g,T,Math.max(0,G.pull));
  G.stuck.forEach(s => { g.globalAlpha = Math.min(1, s.life); drawArrow(g,s.x,s.y,s.ang,T); g.globalAlpha = 1; });
  const tgt = G.cur && G.cur.enemy;
  [...G.enemies].sort((a,b) => b.x - a.x).forEach(e => drawEnemy(g,e,T,e === tgt && e.state === 'walk'));
  for(const a of G.arrows){
    const p = Math.min(1, a.t/a.dur), arc = a.arc;
    const pos = q => [a.x0 + (a.x1-a.x0)*q, a.y0 + (a.y1-a.y0)*q - arc*Math.sin(Math.PI*q)];
    const [x,y] = pos(p), [x2,y2] = pos(Math.min(1,p+.02)), [x0,y0] = pos(Math.max(0,p-.02));
    a.endAng = Math.atan2(y2-y0, x2-x0);
    drawArrow(g,x,y,a.endAng,T);
  }
  if(G.boulder){
    const b = G.boulder, p = Math.min(1, b.t/b.dur);
    const x = b.x0 + (b.x1-b.x0)*p, y = b.y0 + (b.y1-b.y0)*p - 120*Math.sin(Math.PI*p);
    g.save(); g.translate(x,y); g.rotate(p*8);
    g.fillStyle = T.stone; circle(g,0,0,8); g.fill(); g.strokeStyle = T.ink; g.lineWidth = 2; g.stroke();
    g.lineWidth = 1; g.beginPath(); g.moveTo(-4,-2); g.lineTo(1,1); g.lineTo(4,-3); g.stroke();
    g.restore();
  }
  for(const p of G.parts){ g.globalAlpha = Math.max(0, Math.min(1, p.life/.4)); g.fillStyle = p.col; circle(g,p.x,p.y,p.r); g.fill(); }
  g.globalAlpha = 1;
  g.restore();
  if(G.banner){
    const a = Math.min(1, G.banner.t/.3);
    g.globalAlpha = a;
    g.font = '900 20px "Noto Serif TC", serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    const tw = g.measureText(G.banner.text).width + 36;
    g.fillStyle = 'rgba(238,240,234,.94)'; g.strokeStyle = T.ink; g.lineWidth = 2;
    g.beginPath(); g.roundRect(W/2 + 60 - tw/2, 26, tw, 40, 6); g.fill(); g.stroke();
    g.fillStyle = '#1c2428'; g.fillText(G.banner.text, W/2 + 60, 47);
    g.globalAlpha = 1;
  }
  if(G.paused && !G.over){
    g.fillStyle = 'rgba(12,17,20,.55)'; g.fillRect(0,0,W,H);
    g.fillStyle = '#e9ece4'; g.font = '900 28px "Noto Serif TC", serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('暫停中', W/2, H/2);
  }
}

function loop(ts){
  if(!G || G.dead) return;
  const now = ts/1000, dt = Math.min(.05, G.last ? now - G.last : 0);
  G.last = now;
  if(!G.paused && !(G.over && G.endIn <= 0)){
    update(dt);
    if(G.over){ G.endIn -= dt; if(G.endIn <= 0){ const w = G.won; stopGame(); showResult(w); return; } }
  }
  draw();
  G.raf = requestAnimationFrame(loop);
}

function ensureQuestion(){
  if(G.time < G.lock) return;
  const target = G.enemies.filter(e => e.state === 'walk' && !e.doomed).sort((a,b) => a.x - b.x)[0];
  if(!target){ G.cur = null; if(G.panel !== 'wait') renderWait(); return; }
  if(!G.cur || G.cur.enemy !== target || G.cur.stale){
    const q = makeQuestion(target.w, G.pool, target.lastType);
    target.lastType = q.type;
    G.cur = { enemy:target, q };
    renderQ();
  }
}
function renderWait(){
  G.panel = 'wait';
  document.getElementById('qp').innerHTML = `<div class="wait"><div><b>敵軍正在接近</b><br>出現在小路上就會出題，答對讓弓箭手射擊</div></div>`;
}
function renderQ(){
  G.panel = 'q';
  const q = G.cur.q, x = q.word;
  let p;
  if(q.type === 'en2zh') p = `<div class="prompt w">${esc(x.w)}</div>${canSpeak ? `<button class="say" data-say="${esc(x.w)}">${IC.speaker}發音</button>` : ''}`;
  else if(q.type === 'zh2en') p = `<div class="prompt zh">${esc(x.zh)}<span class="pos">${esc(x.pos)}</span></div>`;
  else if(q.type === 'listen') p = `<button class="bigsay" data-say="${esc(x.w)}">${IC.speaker}再聽一次</button>`;
  else { const m = x.ex.match(blankRe(x)); p = `<div class="prompt sent">${esc(x.ex.slice(0,m.index))}<span class="blank"></span>${esc(x.ex.slice(m.index + x.w.length))}</div><div class="trans">${esc(x.exZh)}</div>`; }
  const latin = q.type !== 'en2zh';
  document.getElementById('qp').innerHTML = `
    <div class="qlabel">${TYPE_LABEL[q.type]}</div>
    ${p}
    <div class="opts">${q.labels.map((l,j) => `<button class="opt ${latin?'latin':''}" data-j="${j}"><span class="k">${j+1}</span>${esc(l)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>`;
  bindSay();
  document.querySelectorAll('#qp .opt').forEach(b => b.onclick = () => answer(+b.dataset.j));
  if(q.type === 'listen') setTimeout(() => speak(x.w), 200);
}
function bindSay(){ document.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say)); }
document.addEventListener('keydown', e => {
  if(!G || G.dead || G.over || G.paused || G.panel !== 'q') return;
  const n = parseInt(e.key, 10); if(n >= 1 && n <= 4) answer(n-1);
});

function answer(j){
  if(!G || !G.cur || G.over || G.paused || G.time < G.lock || G.cur.answered) return;
  const { enemy:e, q } = G.cur, x = q.word;
  G.cur.answered = true;
  const ok = q.opts[j].w === q.answer;
  const btns = document.querySelectorAll('#qp .opt');
  btns.forEach((b,n) => { b.disabled = true; if(q.opts[n].w === q.answer) b.classList.add('ok'); });
  const fb = document.getElementById('fb');
  G.pull = 1;
  if(ok){
    e.doomed = true;
    const lead = e.stun > 0 ? 0 : G.cfg.speed*e.spd*.45;
    const left = e.hp - 1;
    G.arrows.push({ x0:142, y0:96, x1:e.x - lead, y1:GROUND - 14*e.scale, t:0, dur:.45, arc:34, hit:true, e });
    G.right++; G.streak++; sfx('shoot');
    if(S.wrong[x.w]){ S.wrong[x.w]--; if(S.wrong[x.w] <= 0) delete S.wrong[x.w]; }
    const more = left <= 0 ? '' : e.kind === 'shield' ? '<br><span class="good">盾牌碎了，再答對 1 次</span>' : `<br><span class="good">${KINDS[e.kind].name}還要再答對 ${left} 次</span>`;
    fb.innerHTML = `<span class="good">命中</span>　<b>${esc(x.w)}</b> <span class="ipa">[${esc(x.ipa)}]</span>　${esc(x.pos)} ${esc(x.zh)}${more}`;
    G.lock = G.time + (left > 0 ? 1.1 : .8);
    if(left > 0) G.cur.stale = true;
    if(G.streak % COMBO === 0){
      const ws = G.enemies.filter(z => z.state === 'walk' && z !== e);
      if(ws.length){
        const mid = ws.reduce((s,z) => s + z.x, 0) / ws.length;
        G.boulder = { x0:70, y0:60, x1:mid, y1:GROUND, t:0, dur:.85 }; sfx('boulder');
        G.banner = { text:`連擊 ${G.streak}　投石擊退`, t:1.6 };
      }else { G.banner = { text:`連擊 ${G.streak}`, t:1.2 }; sfx('combo'); }
    }
  }else{
    btns[j].classList.add('no'); sfx('shoot');
    G.arrows.push({ x0:142, y0:96, x1:e.x + 26 + Math.random()*30, y1:GROUND+6, t:0, dur:.5, arc:30, hit:false, e });
    e.x = Math.max(STOP_X, e.x - 24);
    G.streak = 0;
    G.missed.add(x.w); S.wrong[x.w] = (S.wrong[x.w] || 0) + 1;
    fb.innerHTML = `<span class="bad">射偏了</span>　正確答案是 <b>${esc(x.w)}</b> <span class="ipa">[${esc(x.ipa)}]</span>　${esc(x.pos)} ${esc(x.zh)}<br><span class="trans latin" style="font-size:16px">${esc(x.ex)}</span>`;
    G.lock = G.time + 2.2; G.slowUntil = G.lock;
    G.cur.stale = true;
  }
  save(); hud();
  if(q.type !== 'listen') speak(x.w);
}

function finish(won){
  sfx(won ? 'win' : 'lose');
  G.over = true; G.won = won; G.endIn = 1.3; G.cur = null;
  if(!won) G.banner = { text:'城門被攻破了', t:1.3 };
  else G.banner = { text:'守城成功', t:1.3 };
}

    <div class="sheet help">
      <p>敵人會沿著小路走向城門，每隻敵人身上帶著一個單字。最前面的敵人腳下會出現<b>金色圈</b>，題目就是牠的單字。</p>
      <p>答對，城牆上的弓箭手會射中牠；答錯，箭會射偏，敵人還會往前衝一步。答錯後會顯示正確答案，敵人也會暫時放慢腳步，讓你看清楚。</p>
      <p>連續答對 ${COMBO} 題，投石車會發射石塊，把所有敵人往後擊退並暈眩一下。</p>
      <p>敵人走到城門會敲城牆一下。城牆有 ${MAX_HP} 點耐久，全部用完就失敗。守住時城牆完好拿 3 顆星，剩 3～4 點拿 2 顆星，剩 1～2 點拿 1 顆星。</p>
      <p>首頁上方可以切換兩個單字區。<b>每週講義</b>：每個主題的 20 個字分成兩關，每週最後的小考模擬會從整週的字隨機抽 ${QUIZ.n} 個，適合小考前練習。<b>高頻單字</b>：Unit 1～${HF.units.length}，每個 Unit 分成三關，最後的綜合挑戰會從全部高頻單字隨機抽 ${QUIZ.n} 個。</p>
      <p>題型有四種：看英文選中文、看中文選英文、聽發音選單字、例句填空。用電腦玩可以按鍵盤 1～4 作答。</p>
      <p>每一關標有難度：<span class="tag t0">入門</span>只有墨角兵，<span class="tag t1">進階</span>加入疾行鬼，<span class="tag t2">挑戰</span>再加入盾甲兵，<span class="tag t3">魔王</span>是小考模擬和綜合挑戰，最後會有魔王。要答對好幾次的敵人，頭上會顯示紅色菱形，答對一次少一顆。</p>
    </div>
    <h3 class="lead" style="font-family:var(--display);font-weight:900;color:var(--onDark);font-size:18px;letter-spacing:.08em;margin:6px 0 10px">怪物圖鑑</h3>
    <div class="bestiary">${Object.entries(KINDS).map(([k,K]) => `<div class="beast"><canvas data-kind="${k}" aria-hidden="true"></canvas><div><b>${K.name}</b><p>${K.desc}</p></div></div>`).join('')}</div>
    ${canSpeak ? `<h3 class="lead" style="font-family:var(--display);font-weight:900;color:var(--onDark);font-size:18px;letter-spacing:.08em;margin:6px 0 10px">發音設定</h3>
    <div class="sheet" style="padding:14px 16px;margin-bottom:14px">
      <p style="margin:0 0 10px;font-size:15px">會自動選擇最自然的英文聲音。如果這台裝置的發音聽起來怪怪的，可以在這裡換一個，再按試聽確認。</p>
      <div class="row" style="align-items:center">
        <select id="voiceSel" aria-label="選擇發音聲音" style="flex:1 1 200px;min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;padding:0 10px"></select>
        <button class="btn alt sm" id="voiceTry">${IC.speaker}試聽</button>
      </div>
    </div>` : ''}
    <button class="btn quiet full" id="reset">清除這台裝置的進度</button>`;
  const sel = document.getElementById('voiceSel');
  if(sel){
    fillVoices(sel);
    sel.onchange = () => { S.voice = sel.value; save(); voice = null; speak('The brave boy helped his friend.'); };
    document.getElementById('voiceTry').onclick = () => speak('The brave boy helped his friend.');
  }
  document.querySelectorAll('[data-kind]').forEach(cv => paintKind(cv, cv.dataset.kind));
  document.getElementById('reset').onclick = () => ask('確定要清除所有星星和錯題紀錄嗎？', () => { S.stars = {}; S.wrong = {}; S.seen = {}; save(); showMap(); });
  scrollTo(0,0);
}

if(canSpeak) speechSynthesis.onvoiceschanged = () => { voice = null; const sel = document.getElementById('voiceSel'); if(sel) fillVoices(sel); };
showMap();
</script>
</body>
</html>
